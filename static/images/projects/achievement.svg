<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f2"/>
      <stop offset="50%" stop-color="#fbc4d3"/>
      <stop offset="100%" stop-color="#EA002C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#grad)"/>
  <rect width="600" height="400" fill="url(#glow)"/>
  <text x="300" y="200" text-anchor="middle" font-size="140" dominant-baseline="middle"
        font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">🏆</text>
  <text x="300" y="330" text-anchor="middle" font-size="36" font-weight="700" 
        fill="#A50020" letter-spacing="3"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">AWARD</text>
</svg>