  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/profile.jpg"
    content: |-
      데이터와 AI를 활용해 복잡한 문제를 구조화하고, 기술적 가능성을 실제 서비스와 실행 과제로 연결하는 과정에 관심이 있습니다. 단순히 모델을 개발하는 데서 그치지 않고, 왜 이 문제가 발생했는지 정의하고 어떤 방식이 실제 환경에서 작동할지를 고민합니다.

      CJ올리브네트웍스에서는 고객 데이터를 분석해 브랜드 간 이동 패턴과 비즈니스 실행 과제를 도출했고, 섬루션에서는 기존 부표 제조 사업을 AI 기반 해양 데이터 서비스로 확장했습니다. 또한 실제 공공기관 AI 플랫폼, AI Agent, ML 프로젝트를 수행하며 데이터 분석부터 서비스 구현까지 경험했습니다.

      현재는 AI·데이터와 비즈니스를 함께 이해하며, 기술을 실제 조직의 문제 해결과 의사결정에 연결하는 역량을 넓혀가고 있습니다.
    skills:
      enable: false

