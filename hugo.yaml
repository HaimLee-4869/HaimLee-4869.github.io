              **JBIG 홈페이지 풀스택 유지보수 (React/TypeScript + Django REST + PostgreSQL)**

              - 운영 중인 DB를 Supabase로 무중단 마이그레이션
              - 파일 저장 방식을 Django 로컬에서 NCP Object Storage로 전환, Presigned URL 7단계 업로드로 서버 부하 절감
              - boto3 ExpiresIn 파라미터의 NCP 특이사항을 직접 실험으로 검증하여 이미지 만료 이슈 해결
              - Gunicorn/Nginx 배포 설정 및 환경 변수 가이드 문서화

      - company: "CJ올리브네트웍스"
        companyUrl: "https://www.cjolivenetworks.co.kr"
        jobs:
          - name: "데이터 분석 동계 인턴"
            date: "2024"
            content: |-
              여의도 IFC몰에 입점한 5개 CJ 브랜드의 고객 이동 동선을 분석하여 매출 향상 전략을 도출하는 프로젝트를 수행했습니다.

              - Pandas, Matplotlib, Seaborn 등을 활용한 데이터 전처리·시각화·예측 모델 구축 담당
              - CJ ONE 회원 데이터 분석으로 브랜드 간 교차 방문이 객단가를 약 10% 상승시킨다는 양의 상관관계 확인
              - 로지스틱 회귀 기반 브랜드 방문 예측 모델 (정확도 약 80%, AUC: CGV 0.94 / 올리브영 0.90)
              - CGV 씨네샵 리뉴얼·브랜드 콜라보 팝업 등 실질적 매출 향상 방안을 실무진에 발표

      - company: "KT 에이블스쿨"
        companyUrl: "https://aivle.kt.co.kr"
