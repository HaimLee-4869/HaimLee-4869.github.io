    image: "/images/profile.jpg"
    content: |-
      무엇을 만들지보다 왜 만들어야 하는지를 먼저 묻는 개발자입니다. 전북대 AI/빅데이터 학회 JBIG 회장으로서 풀스택 서비스를 운영하며 실전 개발 경험을 쌓았고, RAG 기반 AI 에이전트와 CNN+LSTM 앙상블 예측 모델 등 다양한 ML/DL 프로젝트로 11개 대회에서 수상했습니다.

      앞으로는 ML/DL을 활용한 연구를 통해 더 깊은 기술적 깊이를 쌓고 싶습니다.
    skills:
      enable: true
      title: "주로 사용하는 기술 스택입니다."
